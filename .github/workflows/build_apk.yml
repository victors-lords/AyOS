name: AyOS APK Derleyici

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java Kurulumu (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Android Projesini Hazırla
        run: |
          flutter create --org com.ayos --project-name ayos .
          # Android 11+ için tüm uygulamaları görme izni (QUERY_ALL_PACKAGES) ekle
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"\/>' android/app/src/main/AndroidManifest.xml

      - name: Paketleri İndir
        run: flutter pub get

      - name: APK Derle (Release)
        run: flutter build apk --release

      - name: APK'yı Yükle (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: AyOS-Console-Release
          path: build/app/outputs/flutter-apk/app-release.apk
