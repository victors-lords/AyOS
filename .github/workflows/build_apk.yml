name: Build AyOS Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Recreate Android Project Framework
        run: |
          # Temiz android yapısı oluştur
          rm -rf android
          flutter create --platforms=android --org com.ayos --project-name ayos .
          # AndroidManifest içine izinleri ekle
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>' android/app/src/main/AndroidManifest.xml

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyOS-PS3-Launcher
          path: build/app/outputs/flutter-apk/app-release.apk
